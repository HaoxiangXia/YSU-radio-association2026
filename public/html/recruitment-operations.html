<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>招新设置与录取结果 - 无线电爱好者协会</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/html/styles.css?v=20260903c"><link rel="stylesheet" href="/_astro/recruitment-operations.NGHk_K18.css"></head><body class="site-page sub-page recruitment-officer-page recruitment-operations-page"><div id="nav-placeholder"></div><header class="subpage-hero subpage-hero--compact"><div class="container subpage-hero__inner"><h1>招新设置与录取结果</h1><p>管理招新开放安排，并安全预览和发布录取名单。</p></div></header><main class="page-container subpage-content operations-grid"><div class="operations-toolbar" aria-label="负责人页面导航"><div class="operations-toolbar__group"><a class="btn-solid" href="/html/membership-applications.html">← 返回入会申请管理</a></div><!-- 退出登录按钮由 common.js 移入导航栏最右端 --><button class="btn-solid" type="button" id="logout-button">退出登录</button></div><section class="card operations-card" aria-labelledby="config-heading"><div class="operations-heading"><h2 id="config-heading">招新业务设置</h2><button class="btn-solid" type="button" id="reload-config-button">重新读取</button></div><p class="operations-heading__sub">所有修改保存后立即生效，请先核对再提交。</p><form id="config-form" class="operations-form-grid"><div class="operations-group"><h3 class="operations-group__title">基本信息</h3><div><label class="form-label" for="cycle">招新周期</label><input class="form-input" id="cycle" name="cycle" maxlength="50" required></div><div><label class="form-label" for="retention-until">资料保留至</label><input class="form-input" id="retention-until" name="retentionUntil" type="date"></div></div><div class="operations-group"><h3 class="operations-group__title">开放安排</h3><label class="operations-toggle operations-field--wide" for="application-enabled"><input id="application-enabled" name="applicationEnabled" type="checkbox"><span class="operations-toggle__track" aria-hidden="true"></span><span class="operations-toggle__text"><strong>开放入会申请</strong><br><span class="operations-help">只有开关开启且当前时间处于起止时间内时，学生才能提交。</span></span></label><div><label class="form-label" for="starts-at">开始时间</label><input class="form-input" id="starts-at" name="startsAt" type="datetime-local"></div><div><label class="form-label" for="ends-at">截止时间</label><input class="form-input" id="ends-at" name="endsAt" type="datetime-local"></div><label class="operations-toggle operations-field--wide" for="admission-enabled"><input id="admission-enabled" name="admissionEnabled" type="checkbox"><span class="operations-toggle__track" aria-hidden="true"></span><span class="operations-toggle__text"><strong>开放录取查询</strong><br><span class="operations-help">必须先关闭查询、发布并复核新名单，再重新开放。</span></span></label></div><div class="operations-group"><h3 class="operations-group__title">告知文案</h3><div class="operations-field--wide"><label class="form-label" for="privacy-notice">个人信息处理说明</label><textarea class="form-input" id="privacy-notice" name="privacyNotice" rows="4" maxlength="1500" required></textarea></div><div class="operations-field--wide"><label class="form-label" for="cross-border-notice">香港服务器存储说明</label><textarea class="form-input" id="cross-border-notice" name="crossBorderNotice" rows="4" maxlength="1500" required></textarea><p class="operations-help">正式开放前必须由负责人确认这段告知文字；学生会在申请页单独勾选同意。</p></div></div><div class="operations-group"><h3 class="operations-group__title">联系方式</h3><div><label class="form-label" for="contact-label">联系方式标题</label><input class="form-input" id="contact-label" name="contactLabel" maxlength="100" required></div><div><label class="form-label" for="contact-qq">QQ群号（可留空）</label><input class="form-input" id="contact-qq" name="contactQq" maxlength="30" inputmode="numeric"></div><div><label class="form-label" for="contact-qq-link">QQ群链接（可留空）</label><input class="form-input" id="contact-qq-link" name="contactQqLink" maxlength="500" type="url" placeholder="https://qm.qq.com/q/..."></div><div class="operations-field--wide"><label class="form-label" for="contact-channel">联系说明</label><textarea class="form-input" id="contact-channel" name="contactChannel" rows="3" maxlength="500" required></textarea></div></div><div class="operations-group"><h3 class="operations-group__title">表单选项</h3><div><label class="form-label" for="colleges">学院选项（每行一项）</label><textarea class="form-input" id="colleges" name="colleges" rows="10" required></textarea></div><div><label class="form-label" for="grades">年级选项（每行一项）</label><textarea class="form-input" id="grades" name="grades" rows="10" required></textarea></div><div class="operations-field--wide"><label class="form-label" for="icp-number">备案号（没有则留空）</label><input class="form-input" id="icp-number" name="icpNumber" maxlength="100"></div></div><div class="operations-field--wide operations-actions"><button class="btn-solid" type="submit" id="save-config-button">检查并保存设置</button></div></form><p class="operations-feedback" id="config-feedback" role="status"></p></section><section class="card operations-card" aria-labelledby="admissions-heading"><div class="operations-heading"><h2 id="admissions-heading">录取名单</h2><button class="btn-solid" type="button" id="reload-admissions-button">刷新状态</button></div><p class="admissions-status" id="admissions-status">正在读取录取名单状态。</p><div class="operations-actions"><button class="btn-solid" type="button" id="download-template-button">下载 Excel 模板</button><input class="form-input" id="admissions-file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"><button class="btn-solid" type="button" id="preview-button">校验并预览</button></div><p class="operations-help">只接受 2 MiB 以内的 `.xlsx`。预览不会替换正式名单；文件不得包含公式、宏或外部链接。</p><div id="preview-result" hidden><div class="preview-summary" id="preview-summary"></div><ul class="preview-errors" id="preview-errors"></ul><div class="preview-table-wrap"><table class="preview-table"><thead><tr><th>姓名</th><th>学号</th><th>申请手机号</th><th>录取部门</th></tr></thead><tbody id="preview-body"></tbody></table></div><div class="operations-actions"><button class="btn-solid" type="button" id="publish-button" disabled>确认发布此名单</button></div></div><p class="operations-feedback" id="admissions-feedback" role="status"></p></section><script type="module" src="/_astro/recruitment-operations.astro_astro_type_script_index_0_lang.CHwKXTUS.js"></script></main><div id="footer-placeholder"></div><button class="scrollTopBtn" title="回到顶部" aria-label="回到顶部">↑</button><div class="image-viewer"><img src="" alt="查看图片"></div><script src="/html/image-assets.js?v=20260819"></script><script src="/html/common.js?v=20260729"></script><script src="/html/reveal.js?v=20260812"></script></body></html>
