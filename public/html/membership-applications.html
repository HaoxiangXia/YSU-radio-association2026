<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入会申请管理 - 无线电爱好者协会</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/html/styles.css?v=20260903c">
  <link rel="stylesheet" href="/html/membership-applications.css?v=20260831">
</head>
<body class="site-page sub-page recruitment-officer-page membership-applications-page">
  <div id="nav-placeholder"></div>

  <header class="subpage-hero subpage-hero--compact">
    <div class="container subpage-hero__inner">
      <h1>入会申请管理</h1>
      <p>查看、筛选与管理当前入会申请。</p>
    </div>
  </header>

  <main class="page-container subpage-content">
    <!-- 页面操作 -->
    <div class="page-actions mb-6">
      <a class="btn-solid btn-sm" href="/html/recruitment-operations.html">招新设置与录取结果</a>
      <button type="button" class="btn-solid btn-sm" id="logout-button">退出登录</button>
    </div>

    <!-- 统计图表 -->
    <div class="card card-section chart-panel mb-6">
      <div class="chart-panel__tabs" role="tablist" aria-label="统计图表切换">
        <button type="button" class="chart-tab is-active" id="chart-tab-trend" role="tab" aria-selected="true" aria-controls="chart-trend" data-chart="trend">近七日申请</button>
        <button type="button" class="chart-tab" id="chart-tab-college" role="tab" aria-selected="false" aria-controls="chart-college" data-chart="college" tabindex="-1">学院分布</button>
      </div>
      <div class="chart-panel__views">
        <div class="chart-view is-active" id="chart-trend" role="tabpanel" aria-labelledby="chart-tab-trend">
          <div class="chart-view__heading">
            <span class="chart-view__title">近七日申请数量</span>
            <span class="chart-view__meta" id="chart-trend-meta">统计中…</span>
          </div>
          <div class="chart-view__canvas" id="trend-chart"></div>
        </div>
        <div class="chart-view" id="chart-college" role="tabpanel" aria-labelledby="chart-tab-college">
          <div class="chart-view__heading">
            <span class="chart-view__title">学院分布</span>
            <span class="chart-view__meta" id="chart-college-meta">共 0 个学院</span>
          </div>
          <div class="chart-view__canvas" id="college-chart"></div>
        </div>
      </div>
    </div>

    <!-- 搜索栏 -->
    <div class="card card-section recruitment-officer-filter-card mb-6">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="搜索姓名、学号、学院..." aria-label="搜索入会申请">
        <select id="college-filter" aria-label="按学院筛选">
          <option value="">所有学院</option>
        </select>
        <select id="grade-filter" aria-label="按年级筛选">
          <option value="">所有年级</option>
        </select>
        <button type="button" class="btn-solid btn-sm" id="refresh-button">刷新</button>
        <button type="button" class="btn-solid btn-sm" id="export-button">导出 CSV</button>
      </div>
      <p id="admin-feedback" class="admin-feedback" role="status"></p>
    </div>

    <!-- 数据表格 -->
    <div class="card card-section recruitment-officer-table-card">
      <div class="recruitment-officer-table-header">
        <span class="font-semibold text-sm text-gray-700">入会申请列表</span>
        <span class="text-sm text-gray-400" id="total-count">共 0 条</span>
      </div>
      <div class="overflow-x-auto">
        <table class="data-table" id="data-table">
          <thead>
            <tr>
              <th>#</th>
              <th>姓名</th>
              <th>学号</th>
              <th>学院</th>
              <th>年级</th>
              <th>联系电话</th>
              <th>电子邮箱</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="data-body">
            <tr><td colspan="8" class="p-8 text-center text-gray-400">暂无数据</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>

    <!-- 操作记录 -->
    <div class="card card-section recruitment-officer-table-card mb-6">
      <div class="recruitment-officer-table-header">
        <span class="font-semibold text-sm text-gray-700">操作记录</span>
        <span class="text-sm text-gray-400" id="operation-records-count">共 0 条</span>
      </div>
      <div class="overflow-x-auto">
        <table class="data-table" id="operation-records-table">
          <thead>
            <tr>
              <th>操作</th>
              <th>申请 ID</th>
              <th>姓名</th>
              <th>学号</th>
              <th>负责人</th>
              <th>操作时间</th>
            </tr>
          </thead>
          <tbody id="operation-records-body">
            <tr><td colspan="6" class="p-8 text-center text-gray-400">暂无操作记录</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="operation-records-pagination"></div>
      <p id="operation-records-feedback" class="admin-feedback" role="status"></p>
    </div>

    <!-- 详情弹窗 -->
    <div id="detail-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title">
      <div class="modal modal--detail">
        <div class="modal-header">
          <h3 id="detail-modal-title" class="font-semibold text-blue-600">入会申请详情</h3>
          <button class="icon-button" id="detail-close-button" type="button" aria-label="关闭详情">&times;</button>
        </div>
        <div class="modal-body" id="detail-content">
          <!-- 详情内容由 JavaScript 动态生成 -->
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <button class="scrollTopBtn" title="回到顶部">↑</button>

  <div class="image-viewer">
    <img src="" alt="查看图片">
  </div>

  <script src="/html/image-assets.js?v=20260819"></script>
  <script src="/html/common.js?v=20260729"></script>
  <script src="/html/vendor/echarts.min.js?v=20260831"></script>
  <script src="/html/membership-applications.js?v=20260831"></script>
</body>
</html>
