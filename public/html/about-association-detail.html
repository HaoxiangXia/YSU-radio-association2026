<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>协会详情 - 无线电爱好者协会</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/html/styles.css">
  <style>
.max-w-6xl {
  max-width: 1100px;
}

.mx-auto {
  margin-left: auto;
  margin-right: auto;
}

.px-4 {
  padding-left: 1rem;
  padding-right: 1rem;
}

.py-10 {
  padding-top: 2.5rem;
  padding-bottom: 2.5rem;
}

/* Hero 区域 */
.hero {
  position: relative;
  height: clamp(320px, 34vw, 400px);
  overflow: hidden;
  isolation: isolate;
  background: #071a38;
}

.hero-bg {
  position: absolute;
  inset: 0;
  z-index: -1;
}

.hero-content {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  height: 100%;
  color: white;
}

.hero-copy {
  position: relative;
  max-width: 740px;
}

.hero-eyebrow {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 0.75rem;
  color: #bfdbfe;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.16em;
}

.hero-eyebrow span {
  width: 2.25rem;
  height: 1px;
  background: #60a5fa;
  box-shadow: 0 0 8px rgba(96, 165, 250, 0.8);
}

.hero-content h1 {
  max-width: 720px;
  font-size: clamp(2rem, 4vw, 3.25rem);
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 0.9rem;
  letter-spacing: 0.025em;
  text-shadow: 0 3px 18px rgba(2, 12, 29, 0.48);
}

.hero-content p {
  max-width: 36rem;
  margin-bottom: 1.65rem;
  color: rgba(239, 246, 255, 0.88);
  font-size: clamp(1rem, 1.6vw, 1.15rem);
  letter-spacing: 0.025em;
  text-shadow: 0 2px 8px rgba(2, 12, 29, 0.45);
}

.hero-buttons {
  display: flex;
  gap: 0.75rem;
}

.hero .hero-btn-primary {
  background: #ffffff;
  border-color: #ffffff;
  color: #1d4ed8;
  box-shadow: 0 8px 22px rgba(2, 12, 29, 0.16);
}

.hero .hero-btn-primary:hover {
  background: #eff6ff;
  border-color: #eff6ff;
  color: #1d4ed8;
}

.hero .hero-btn-secondary {
  background: rgba(15, 54, 107, 0.48);
  border-color: rgba(191, 219, 254, 0.65);
  backdrop-filter: blur(4px);
}

.home-about-section {
  scroll-margin-top: 4.5rem;
}

@media (max-width: 800px) {
  .hero {
    height: 320px;
  }

  .hero-content {
    padding-top: 0.5rem;
    padding-bottom: 0.5rem;
  }

  .hero-copy {
    max-width: 32rem;
  }

  .hero-eyebrow {
    margin-bottom: 0.65rem;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
  }

  .hero-eyebrow span {
    width: 1.5rem;
  }

  .hero-content h1 {
    max-width: 20rem;
    font-size: clamp(1.8rem, 8vw, 2.25rem);
  }

  .hero-content p {
    margin-bottom: 1.35rem;
    font-size: 0.95rem;
  }

  .hero-signal {
    right: -70px;
    width: 230px;
    opacity: 0.26;
  }

  .hero-wave {
    right: -18%;
    bottom: 10%;
    width: 80vw;
    opacity: 0.1;
  }

  .hero-grid {
    opacity: 0.1;
    background-size: 34px 34px;
  }

  .hero-signal span,
  .hero-wave {
    animation: none;
  }
}

@media (max-width: 540px) {
  .hero {
    height: 300px;
  }

  .hero-signal {
    opacity: 0.18;
  }

  .hero-wave {
    display: none;
  }
}

@media (max-width: 390px) {
  .hero-buttons {
    gap: 0.6rem;
  }

  .hero-buttons .btn-primary {
    padding-right: 1.1rem;
    padding-left: 1.1rem;
  }
}

/* 按钮 */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  min-height: 2.75rem;
  padding: 0.6rem 1.5rem;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.5);
  color: #fff;
  font-size: 0.95rem;
  font-weight: 500;
  border-radius: 4px;
  transition:
    background-color 200ms ease,
    border-color 200ms ease,
    color 200ms ease,
    box-shadow 200ms ease,
    transform 200ms ease;
  cursor: pointer;
  text-decoration: none;
}

.btn-primary:hover {
  background: rgba(255,255,255,0.35);
  color: #fff;
  box-shadow: 0 6px 16px rgba(15, 23, 42, 0.14);
}

.home-content-card {
  box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
}

.recent-event-card h3 {
  transition: color 180ms ease;
}

.recent-event-card:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 3px;
}

.mt-6 {
  margin-top: 1.5rem;
}

.px-3 {
  padding-right: 0.75rem;
  padding-left: 0.75rem;
}

.py-2 {
  padding-top: 0.5rem;
  padding-bottom: 0.5rem;
}

.text-lg {
  font-size: 1.125rem;
}

.bg-gray-100 {
  background-color: #f3f4f6;
}

.block {
  display: block;
}

.justify-center {
  justify-content: center;
}

.space-y-1 > * + * {
  margin-top: 0.25rem;
}

.space-y-1\.5 > * + * {
  margin-top: 0.375rem;
}

.overflow-hidden {
  overflow: hidden;
}

.h-full {
  height: 100%;
}

.object-cover {
  object-fit: cover;
}

.aspect-video {
  aspect-ratio: 16/9;
}

.transition-colors {
  transition: color 0.2s ease, background-color 0.2s ease;
}

/* 侧边栏 */
.sidebar-card {
  background: white;
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  padding: 1rem;
}

.sidebar-card h4 {
  font-weight: 600;
  font-size: 0.875rem;
  margin-bottom: 0.75rem;
  color: #374151;
  border-bottom: 1px solid #f3f4f6;
  padding-bottom: 0.5rem;
}

/* 首页第五轮：抽象光场与高级交互（仅限首页作用域） */
.about-association-page {
  --home-electric-blue: #2563eb;
  --home-cyan: #0891b2;
  --home-panel-light: #dceafb;
  --home-surface-blue: #f1f6fd;
  --home-line-blue: rgba(37, 99, 235, 0.2);
  min-height: 100vh;
  min-height: 100svh;
  padding-top: 0;
  background: #f5f8fc;
}

.about-association-page .hero {
  height: clamp(560px, 72vh, 680px);
  min-height: 560px;
  background: linear-gradient(125deg, #eef7ff 0%, #e4f1fc 48%, #d8eaf8 100%);
}

.about-association-page .home-hero-canvas {
  position: absolute;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.about-association-page .home-hero-mesh {
  position: absolute;
  inset: 0;
  z-index: 1;
  opacity: 0.42;
  background-image:
    linear-gradient(rgba(30, 78, 121, 0.13) 1px, transparent 1px),
    linear-gradient(90deg, rgba(30, 78, 121, 0.13) 1px, transparent 1px);
  background-position: center;
  background-size: 52px 52px;
  -webkit-mask-image: linear-gradient(90deg, transparent 4%, rgba(0, 0, 0, 0.22) 34%, #000 58%, #000);
  mask-image: linear-gradient(90deg, transparent 4%, rgba(0, 0, 0, 0.22) 34%, #000 58%, #000);
  pointer-events: none;
}

.about-association-page .hero-content {
  z-index: 6;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 4.5rem;
  padding-bottom: 4rem;
}

.about-association-page .home-hero-copy {
  position: relative;
  width: min(100%, 900px);
  max-width: 900px;
}

.about-association-page .hero-eyebrow {
  gap: 0;
  margin-bottom: 1rem;
  color: #315d88;
  font-size: 0.72rem;
  letter-spacing: 0.2em;
}

.about-association-page .hero-content h1 {
  max-width: 900px;
  margin-bottom: 1.25rem;
  font-size: clamp(3rem, 5.9vw, 5.35rem);
  font-weight: 720;
  line-height: 1.05;
  letter-spacing: -0.025em;
  text-wrap: balance;
  color: #10233f;
  text-shadow: none;
}

.about-association-page .hero-content p {
  max-width: 42rem;
  margin-bottom: 2rem;
  color: #52657d;
  font-size: clamp(1.05rem, 1.5vw, 1.24rem);
  letter-spacing: 0.03em;
  text-shadow: none;
}

.about-association-page .hero-buttons {
  gap: 0.85rem;
}

.about-association-page .hero-btn-primary,
.about-association-page .hero-btn-secondary {
  position: relative;
  overflow: hidden;
  min-width: 8rem;
  border-radius: 0.65rem;
  transition:
    transform 220ms ease,
    border-color 220ms ease,
    box-shadow 220ms ease,
    background-color 220ms ease;
}

.about-association-page .hero .hero-btn-primary {
  color: #ffffff;
  border-color: #2563eb;
  background: #2563eb;
  box-shadow: 0 10px 26px rgba(37, 99, 235, 0.2);
}

.about-association-page .hero .hero-btn-secondary {
  color: #1e4f91;
  border-color: rgba(30, 79, 145, 0.32);
  background: rgba(255, 255, 255, 0.66);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}

.about-association-page .home-hero-scroll-cue {
  display: flex;
  width: max-content;
  align-items: center;
  gap: 0.7rem;
  margin-top: 3.2rem;
  color: rgba(49, 93, 136, 0.68);
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.18em;
}

.about-association-page .home-hero-scroll-cue span {
  width: 2.8rem;
  height: 1px;
  overflow: hidden;
  background: rgba(30, 79, 145, 0.18);
}

.about-association-page .home-hero-scroll-cue span::after {
  content: "";
  display: block;
  width: 50%;
  height: 100%;
  background: linear-gradient(90deg, transparent, var(--home-electric-blue));
  transform: translateX(-100%);
  animation: about-home-scroll-cue 2.8s ease-in-out infinite;
}

.about-association-page .home-about-section {
  padding-top: 4.25rem;
  padding-bottom: 4.25rem;
}

.about-association-page .home-news-section,
.about-association-page .home-honors-section {
  position: relative;
  overflow: hidden;
  padding: 4.5rem 0;
}

.about-association-page .home-news-section {
  border-top: 1px solid #dce8f7;
  background: var(--home-surface-blue);
}

.about-association-page .home-news-section::before,
.about-association-page .home-honors-section::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  width: min(72rem, calc(100% - 2rem));
  height: 1px;
  background: rgba(96, 165, 250, 0.35);
  transform: translateX(-50%);
}

.about-association-page .home-section-inner {
  position: relative;
  z-index: 1;
}

.about-association-page .home-news-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.15rem;
}

.about-association-page .recent-event-card {
  display: flex;
  min-height: 230px;
  flex-direction: column;
  overflow: hidden;
  padding: 1.55rem;
  border-top: 3px solid #2563eb;
  border-color: rgba(59, 130, 246, 0.14);
  background: #ffffff;
  color: inherit;
  text-decoration: none;
}

.about-association-page .home-card-meta,
.about-association-page .home-honor-card-head,
.about-association-page .home-honor-card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}

.about-association-page .home-card-meta {
  margin-bottom: 1.35rem;
}

.about-association-page .home-card-kicker,
.about-association-page .home-honor-kicker {
  font-size: 0.63rem;
  font-weight: 700;
  letter-spacing: 0.12em;
}

.about-association-page .home-card-kicker {
  color: #2563eb;
}

.about-association-page .home-card-date {
  flex: 0 0 auto;
  color: #64748b;
  font-size: 0.74rem;
}

.about-association-page .recent-event-card h3 {
  color: #163b75;
  line-height: 1.4;
}

.about-association-page .recent-event-card p {
  color: #52647b;
}

.about-association-page .home-card-link-cue {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  margin-top: auto;
  padding-top: 1.5rem;
  color: #2563eb;
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.11em;
}

.about-association-page .home-card-link-cue i {
  font-style: normal;
  transition: transform 180ms ease;
}

.about-association-page .home-honors-section {
  color: #dbeafe;
  background: #071a36;
}

.about-association-page .home-honors-section .more-link {
  color: #bae6fd;
}

.about-association-page .home-honors-section .more-link:focus-visible {
  outline-color: #7dd3fc;
}

.about-association-page .home-honor-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1rem;
}

.about-association-page .home-honor-card {
  position: relative;
  display: flex;
  min-height: 260px;
  flex-direction: column;
  overflow: hidden;
  padding: 1.5rem;
  border: 1px solid rgba(147, 197, 253, 0.19);
  border-radius: var(--radius);
  border-top: 3px solid #60a5fa;
  background: linear-gradient(145deg, rgba(20, 57, 105, 0.78), rgba(6, 29, 62, 0.9));
  box-shadow: 0 14px 34px rgba(1, 8, 22, 0.2);
  transition:
    transform 220ms ease,
    border-color 220ms ease,
    box-shadow 220ms ease;
}

.about-association-page .home-honor-kicker {
  color: #7dd3fc;
}

.about-association-page .home-honor-rank {
  flex: 0 0 auto;
  padding: 0.22rem 0.5rem;
  border: 1px solid rgba(251, 191, 36, 0.4);
  border-radius: 999px;
  color: #fde68a;
  background: rgba(245, 158, 11, 0.08);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.about-association-page .home-honor-card h3 {
  margin: 1.4rem 0 0.85rem;
  color: #f8fbff;
  font-size: 1.08rem;
  font-weight: 700;
  line-height: 1.55;
}

.about-association-page .home-honor-card p {
  color: #b9cbe3;
  font-size: 0.87rem;
  line-height: 1.75;
}

.about-association-page .home-honor-card-foot {
  margin-top: auto;
  padding-top: 1.5rem;
  color: #7f9bbd;
  font-size: 0.58rem;
  letter-spacing: 0.12em;
}

@media (hover: hover) {
  .about-association-page .recent-event-card:hover .home-card-link-cue i {
    transform: translateX(3px);
  }

  .about-association-page .home-honor-card:hover {
    transform: translateY(-3px);
    border-color: rgba(125, 211, 252, 0.38);
    box-shadow: 0 18px 40px rgba(1, 8, 22, 0.3);
  }
}

@media (max-width: 1023px) {
  .about-association-page .hero {
    height: 480px;
  }

  .about-association-page .hero-content {
    grid-template-columns: minmax(0, 1.15fr) minmax(290px, 0.85fr);
    gap: 1.75rem;
  }

  .about-association-page .hero-content h1 {
    font-size: clamp(2.35rem, 4.8vw, 3.1rem);
  }

}

@media (max-width: 900px) {
  .about-association-page .home-honor-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 800px) {
  .about-association-page .hero {
    height: auto;
    min-height: 0;
  }

  .about-association-page .hero-content {
    grid-template-columns: minmax(0, 1fr);
    gap: 1.4rem;
    padding-top: 2.75rem;
    padding-bottom: 2.75rem;
  }

  .about-association-page .hero-copy {
    max-width: 38rem;
  }

  .about-association-page .hero-content h1 {
    max-width: 34rem;
    font-size: clamp(2.15rem, 7vw, 2.75rem);
  }

  .about-association-page .home-about-section {
    padding-top: 3.25rem;
    padding-bottom: 3.25rem;
  }

  .about-association-page .home-news-section,
  .about-association-page .home-honors-section {
    padding: 3.5rem 0;
  }

  .about-association-page .recent-event-card {
    min-height: 210px;
  }
}

@media (max-width: 640px) {
  .about-association-page .home-honor-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .about-association-page .home-honor-card {
    min-height: 230px;
  }
}

@media (max-width: 540px) {
  .about-association-page .hero-content {
    gap: 1.25rem;
    padding-top: 2.35rem;
    padding-bottom: 2.35rem;
  }

  .about-association-page .hero-content h1 {
    font-size: clamp(2rem, 9vw, 2.35rem);
  }

  .about-association-page .home-news-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .about-association-page .themed-section-header {
    align-items: flex-end;
    gap: 0.75rem;
  }

  .about-association-page .recent-event-card,
  .about-association-page .home-honor-card {
    padding: 1.3rem;
  }

  .about-association-page .recent-event-card {
    min-height: 0;
  }
}

.grid-cols-4 {
  grid-template-columns: repeat(4, 1fr);
}

.about-association-page .about-assoc-intro {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 2rem;
  align-items: start;
  padding: clamp(1.5rem, 2.5vw, 2.25rem);
}

.about-association-page .about-assoc-intro__body {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.about-association-page .about-assoc-intro__body p {
  font-size: clamp(1.05rem, 1.6vw, 1.18rem);
  line-height: 1.85;
  color: #475569;
}

.about-association-page .about-assoc-intro__body p .font-semibold,
.about-association-page .about-assoc-intro__body p .font-medium {

.association-media {

  height: 100%;

.association-media img {

  height: 100%;
  object-fit: cover;
}

.about-association-page .about-assoc-intro__stats {

  grid-template-columns: repeat(2, 1fr);

/* 第五轮内容层次与进入动效 */
.about-association-page main {
  background: #f8faff;
}

@media (max-width: 800px) {
  .grid-cols-4 {
  grid-template-columns: repeat(4, 1fr);
}

.about-association-page .about-assoc-intro {
    grid-template-columns: 1fr;
  }

  .about-association-page .about-assoc-intro__body p {

  .about-association-page .about-assoc-intro__stats {
    grid-template-columns: repeat(2, 1fr);
  }

.about-association-page .home-about-section {
  position: relative;
}

.about-association-page .home-about-section .card,

  border-color: rgba(111, 142, 196, 0.16);
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(247, 250, 255, 0.92));

.about-association-page .home-section-header {

  flex-direction: column;
  gap: 0.45rem;
}

.about-association-page .home-section-index {
  color: #5578b9;
  font-size: 0.64rem;
  font-weight: 750;
  letter-spacing: 0.18em;
}

.about-association-page .home-section-heading h2 {
  position: relative;
  margin: 0;
  padding-bottom: 0.9rem;
  color: #101d35;
  font-size: clamp(1.8rem, 3vw, 2.35rem);
  font-weight: 720;
  line-height: 1.15;
  letter-spacing: -0.02em;
}

.about-association-page .home-section-heading h2::after {
  content: "";
  position: absolute;

  background: var(--home-electric-blue);
}

.about-association-page .home-news-section {
  isolation: isolate;
  border-top-color: rgba(107, 139, 196, 0.16);

}

.about-association-page .home-news-section::after {
  content: "";
  position: absolute;
  z-index: 0;
  top: -12rem;
  right: -10rem;

</head>
<body class="site-page sub-page about-page about-association-page">
  <div id="nav-placeholder"></div>

  <main class="page-container subpage-content about-association-content departments-content">
    <button type="button" class="scroll-back-cue" id="scrollBackCue" aria-label="上滑返回首屏">
      <span>上滑返回首屏</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>

    <section id="departments" class="about-section about-departments card card-section">
      <div class="section-header">
        <div>
          <p class="section-eyebrow">DEPARTMENTS</p>
          <h2 class="card-title">部门介绍</h2>
          <p class="section-desc">探索五个部门的方向、职责与成长路径。</p>
        </div>
      </div>
      <h3 class="department-group-title">技术部门</h3>
      <div class="department-grid" id="department-grid-technical"></div>
      <h3 class="department-group-title">非技术部门</h3>
      <div class="department-grid" id="department-grid-non-technical"></div>
    </section>

    <section id="news" class="about-section about-news card card-section">
      <div class="section-header">
        <div>
          <p class="section-eyebrow">RECENT UPDATES</p>
          <h2 class="card-title">最新动态</h2>
        </div>
        <a href="/html/activities.html" class="more-link">查看更多 <span aria-hidden="true">→</span></a>
      </div>
      <div class="news-list" id="recent-events"></div>
    </section>

    <section id="honors" class="about-section about-honors card card-section">
      <div class="section-header">
        <div>
          <p class="section-eyebrow">HONORS</p>
          <h2 class="card-title">荣誉成就</h2>
        </div>
        <a href="/html/honors.html" class="more-link">查看更多 <span aria-hidden="true">→</span></a>
      </div>
      <div class="honor-list" id="honors-grid"></div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <button class="scrollTopBtn" title="回到顶部" aria-label="回到顶部">↑</button>

  <div class="image-viewer">
    <img src="" alt="查看图片">
  </div>

  <script src="/html/data.js"></script>
  <script src="/html/common.js"></script>
  <script src="/html/about-association.js"></script>
  <script src="/html/vendor/gsap.min.js"></script>
  <script src="/html/vendor/ScrollTrigger.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setupReveals();
      setupScrollBackCue();
      setupReturnToLanding();
    });

    // 卡片滚动进入动画（GSAP 未加载或用户偏好减弱动效时跳过）
    function setupReveals() {
      if (typeof gsap === 'undefined') return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      gsap.registerPlugin(ScrollTrigger);

      gsap.from('.department-card', {
        y: 24,
        opacity: 0,
        duration: 0.6,
        ease: 'power2.out',
        stagger: 0.08,
        scrollTrigger: {
          trigger: '#departments',
          start: 'top 75%',
          toggleActions: 'play none none reverse',
        },
      });

      gsap.from('.news-card, .honor-card', {
        y: 18,
        opacity: 0,
        duration: 0.5,
        ease: 'power2.out',
        stagger: 0.06,
        scrollTrigger: {
          trigger: '#recent-events',
          start: 'top 85%',
          toggleActions: 'play none none reverse',
        },
      });
    }

    // 返回首屏提示：位于顶部时显示，点击返回主页
    function setupScrollBackCue() {
      const cue = document.getElementById('scrollBackCue');
      if (!cue) return;

      const onScroll = () => {
        if (window.scrollY <= 0) {
          cue.classList.add('is-visible');
        } else {
          cue.classList.remove('is-visible');
        }
      };

      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      cue.addEventListener('click', () => {
        window.location.href = '/html/about-association.html';
      });
    }

    // 顶部继续上滑/下拉时返回首屏
    function setupReturnToLanding() {
      const landingUrl = '/html/about-association.html';
      let redirecting = false;
      let entranceLock = true;
      setTimeout(() => { entranceLock = false; }, 1000);

      function redirectToLanding() {
        if (entranceLock || redirecting) return;
        redirecting = true;
        window.location.href = landingUrl;
      }

      window.addEventListener('wheel', (e) => {
        if (window.scrollY <= 0 && e.deltaY < -30) {
          redirectToLanding();
        }
      }, { passive: true });

      let touchStartY = 0;
      window.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });
      window.addEventListener('touchend', (e) => {
        if (window.scrollY > 0) return;
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        if (deltaY > 50) {
          redirectToLanding();
        }
      }, { passive: true });
    }
  </script>
</body>
</html>
