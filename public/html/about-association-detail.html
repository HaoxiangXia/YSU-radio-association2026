<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>协会详情 - 无线电爱好者协会</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/html/styles.css?v=20260811">
  <link rel="stylesheet" href="/html/about-association.css?v=20260729-5">
</head>
<body class="site-page sub-page about-page about-association-page">
  <div id="nav-placeholder"></div>

  <main class="page-container subpage-content about-association-content departments-content">
    <button type="button" class="scroll-back-cue" id="scrollBackCue" aria-label="上滑返回首屏">
      <span>上滑返回首屏</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>

    <section id="departments" class="about-section about-departments card card-section">
      <div class="section-header">
        <div>
          <p class="section-eyebrow">DEPARTMENTS</p>
          <h2 class="card-title">部门介绍</h2>
          <p class="section-desc">探索五个部门的方向、职责与成长路径。</p>
        </div>
      </div>
      <h3 class="department-group-title">技术部门</h3>
      <div class="department-grid" id="department-grid-technical"></div>
      <h3 class="department-group-title">非技术部门</h3>
      <div class="department-grid" id="department-grid-non-technical"></div>
    </section>

    <section id="news" class="about-section about-news card card-section">
      <div class="section-header">
        <div>
          <p class="section-eyebrow">RECENT UPDATES</p>
          <h2 class="card-title">最新动态</h2>
        </div>
        <a href="/html/competition-activities.html" class="more-link">查看更多 <span aria-hidden="true">→</span></a>
      </div>
      <div class="news-list" id="recent-events"></div>
    </section>

    <section id="honors" class="about-section about-honors card card-section">
      <div class="section-header">
        <div>
          <p class="section-eyebrow">HONORS</p>
          <h2 class="card-title">荣誉成就</h2>
        </div>
        <a href="/html/honors.html" class="more-link">查看更多 <span aria-hidden="true">→</span></a>
      </div>
      <div class="honor-list" id="honors-grid"></div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <button class="scrollTopBtn" title="回到顶部" aria-label="回到顶部">↑</button>

  <div class="image-viewer">
    <img src="" alt="查看图片">
  </div>

  <script src="/html/data.js"></script>
  <script src="/html/image-assets.js?v=20260729"></script>
  <script src="/html/common.js?v=20260729"></script>
  <script src="/html/about-association.js"></script>
  <script src="/html/vendor/gsap.min.js"></script>
  <script src="/html/vendor/ScrollTrigger.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setupReveals();
      setupScrollBackCue();
      setupReturnToLanding();
    });

    // 卡片滚动进入动画（GSAP 未加载或用户偏好减弱动效时跳过）
    function setupReveals() {
      if (typeof gsap === 'undefined') return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      gsap.registerPlugin(ScrollTrigger);

      gsap.from('.department-card', {
        y: 24,
        opacity: 0,
        duration: 0.6,
        ease: 'power2.out',
        stagger: 0.08,
        scrollTrigger: {
          trigger: '#departments',
          start: 'top 75%',
          toggleActions: 'play none none reverse',
        },
      });

      // 最新动态由 data.js 在页面加载时插入；不对它应用初始透明动画，
      // 以免滚动触发器未执行时整组卡片不可见。
      gsap.from('.honor-card', {
        y: 18,
        opacity: 0,
        duration: 0.5,
        ease: 'power2.out',
        stagger: 0.06,
        scrollTrigger: {
          trigger: '#honors',
          start: 'top 85%',
          toggleActions: 'play none none reverse',
        },
      });
    }

    // 返回首屏提示：位于顶部时显示，点击返回主页
    function setupScrollBackCue() {
      const cue = document.getElementById('scrollBackCue');
      if (!cue) return;

      const onScroll = () => {
        if (window.scrollY <= 0) {
          cue.classList.add('is-visible');
        } else {
          cue.classList.remove('is-visible');
        }
      };

      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      cue.addEventListener('click', () => {
        window.location.href = '/html/about-association.html';
      });
    }

    // 顶部继续上滑/下拉时返回首屏
    function setupReturnToLanding() {
      const landingUrl = '/html/about-association.html';
      let redirecting = false;
      let entranceLock = true;
      setTimeout(() => { entranceLock = false; }, 1000);

      function redirectToLanding() {
        if (entranceLock || redirecting) return;
        redirecting = true;
        window.location.href = landingUrl;
      }

      window.addEventListener('wheel', (e) => {
        if (window.scrollY <= 0 && e.deltaY < -30) {
          redirectToLanding();
        }
      }, { passive: true });

      let touchStartY = 0;
      window.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });
      window.addEventListener('touchend', (e) => {
        if (window.scrollY > 0) return;
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        if (deltaY > 50) {
          redirectToLanding();
        }
      }, { passive: true });
    }
  </script>
</body>
</html>
