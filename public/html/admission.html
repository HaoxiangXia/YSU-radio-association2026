<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>录取查询 - 无线电爱好者协会</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/html/styles.css?v=20260813">
  <link rel="stylesheet" href="/html/admission.css?v=20260813">
</head>
<body class="site-page sub-page query-page">
  <div id="nav-placeholder"></div>

  <header class="subpage-hero subpage-hero--compact">
    <div class="container subpage-hero__inner">
      <h1>录取查询</h1>
      <p>输入学号和手机号查询录取结果，查询结果以协会正式通知为准。</p>
    </div>
  </header>

  <main class="page-container page-container--narrow subpage-content query-content">
    <section class="card card-section mb-6 query-card">
      <h2 class="card-title">查询录取结果</h2>

      <div class="query-form">
        <input type="text" id="student-id-input" class="form-input" placeholder="请输入12位学号" aria-label="学号" inputmode="numeric" maxlength="12">
        <input type="tel" id="phone-input" class="form-input" placeholder="请输入手机号" aria-label="手机号" inputmode="numeric" maxlength="11">
        <button type="button" class="btn-solid" id="query-button" disabled>正在读取查询安排</button>
      </div>
      
      <div id="query-result" class="mt-4 hidden">
        <!-- 查询结果由 JavaScript 动态生成 -->
      </div>
    </section>

    <aside class="card card-section query-guide">
      <h3 class="font-bold text-gray-800 mb-3">查询说明</h3>
      <ul class="space-y-2 text-sm text-gray-600">
        <li class="flex items-start gap-2">
          <span class="text-blue-400 mt-1">-</span>
          请输入完整的12位学号和入会申请时填写的手机号
        </li>
        <li class="flex items-start gap-2">
          <span class="text-blue-400 mt-1">-</span>
          查询结果仅供参考，最终录取结果以协会通知为准
        </li>
        <li class="flex items-start gap-2">
          <span class="text-blue-400 mt-1">-</span>
          <span id="admission-contact">联系方式正在加载。</span>
        </li>
      </ul>
    </aside>
  </main>

  <div id="footer-placeholder"></div>

  <button class="scrollTopBtn" title="回到顶部">↑</button>

  <div class="image-viewer">
    <img src="" alt="查看图片">
  </div>

  <script src="/html/image-assets.js?v=20260819"></script>
  <script src="/html/common.js?v=20260729"></script>
  <script src="/html/admission.js?v=20260813"></script>
</body>
</html>
