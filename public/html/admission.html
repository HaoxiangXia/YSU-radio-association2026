<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>录取查询 - 无线电爱好者协会</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/html/styles.css?v=20260801">
  <style>
.mb-3 {
  margin-bottom: 0.75rem;
}

.mt-4 {
  margin-top: 1rem;
}

.p-4 {
  padding: 1rem;
}

.text-3xl {
  font-size: 1.875rem;
}

.text-blue-400 {
  color: #60a5fa;
}

.text-red-600 {
  color: #dc2626;
}

.bg-gray-50 {
  background-color: #f9fafb;
}

.bg-red-50 {
  background-color: #fef2f2;
}

.border-gray-200 {
  border-color: #e5e7eb;
}

.border-red-200 {
  border-color: #fecaca;
}

.query-form {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 1rem;
}

.query-form .form-input {
  min-width: 0;
  flex: 1;
}

.query-form .btn-solid {
  width: 100%;
}

.site-page .query-form {
  padding: 0.3rem;
  border-radius: 11px;
}

.site-page #query-result > div {
  border-radius: 11px;
  box-shadow: 0 12px 32px rgba(15, 23, 42, 0.07);
}

.site-page.query-page .query-card {
  position: relative;
  overflow: hidden;
  border-top: 3px solid #2563eb;
  background: #ffffff;
}

.site-page.query-page .query-card .card-title {
  font-size: clamp(1.35rem, 2.5vw, 1.75rem);
}

.site-page.query-page .query-form {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.75rem;
  margin-top: 1.25rem;
  padding: 0.8rem;
  border: 1px solid rgba(59, 130, 246, 0.13);
  background: rgba(239, 246, 255, 0.66);
}

.site-page.query-page .query-guide {
  border-color: rgba(148, 163, 184, 0.18);
  background: rgba(255, 255, 255, 0.82);
  box-shadow: 0 12px 34px rgba(15, 23, 42, 0.055);
}

.site-page.query-page .query-guide li > span {
  color: #2563eb;
}
  </style>
</head>
<body class="site-page sub-page query-page">
  <div id="nav-placeholder"></div>

  <header class="subpage-hero subpage-hero--compact">
    <div class="container subpage-hero__inner">
      <h1>录取查询</h1>
      <p>输入学号和手机号查询录取结果，查询结果以协会正式通知为准。</p>
    </div>
  </header>

  <main class="page-container page-container--narrow subpage-content query-content">
    <section class="card card-section mb-6 query-card">
      <h2 class="card-title">查询录取结果</h2>

      <div class="query-form">
        <input type="text" id="student-id-input" class="form-input" placeholder="请输入12位学号" aria-label="学号" inputmode="numeric" maxlength="12">
        <input type="tel" id="phone-input" class="form-input" placeholder="请输入手机号" aria-label="手机号" inputmode="numeric" maxlength="11">
        <button type="button" class="btn-solid" id="query-button" disabled>正在读取查询安排</button>
      </div>
      
      <div id="query-result" class="mt-4" style="display: none;">
        <!-- 查询结果由 JavaScript 动态生成 -->
      </div>
    </section>

    <aside class="card card-section query-guide">
      <h3 class="font-bold text-gray-800 mb-3">查询说明</h3>
      <ul class="space-y-2 text-sm text-gray-600">
        <li class="flex items-start gap-2">
          <span class="text-blue-400 mt-1">-</span>
          请输入完整的12位学号和入会申请时填写的手机号
        </li>
        <li class="flex items-start gap-2">
          <span class="text-blue-400 mt-1">-</span>
          查询结果仅供参考，最终录取结果以协会通知为准
        </li>
        <li class="flex items-start gap-2">
          <span class="text-blue-400 mt-1">-</span>
          <span id="admission-contact">联系方式正在加载。</span>
        </li>
      </ul>
    </aside>
  </main>

  <div id="footer-placeholder"></div>

  <button class="scrollTopBtn" title="回到顶部">↑</button>

  <div class="image-viewer">
    <img src="" alt="查看图片">
  </div>

  <script src="/html/image-assets.js?v=20260729"></script>
  <script src="/html/common.js?v=20260729"></script>
  <script>
    let admissionQueryEnabled = false;

    function clearResult() {
      const resultDiv = document.getElementById('query-result');
      resultDiv.replaceChildren();
      resultDiv.style.display = 'none';
    }

    function showResult({ title, message = '', status = '', department = '', kind = 'neutral' }) {
      const resultDiv = document.getElementById('query-result');
      const card = document.createElement('div');
      const colorClasses = {
        error: 'bg-red-50 border-red-200',
        accepted: 'bg-green-50 border-green-200',
        rejected: 'bg-yellow-50 border-yellow-200',
        neutral: 'bg-gray-50 border-gray-200',
      };
      card.className = `${colorClasses[kind]} border rounded-lg p-4`;

      const center = document.createElement('div');
      center.className = 'text-center';
      const heading = document.createElement('h3');
      heading.className = 'font-bold text-gray-800 mb-2';
      heading.textContent = title;
      center.appendChild(heading);

      if (status) {
        const statusElement = document.createElement('p');
        statusElement.className = `${kind === 'accepted' ? 'text-green-600' : 'text-yellow-600'} font-medium mb-2`;
        statusElement.textContent = status;
        center.appendChild(statusElement);
      }
      if (department) {
        const departmentElement = document.createElement('p');
        departmentElement.className = 'text-gray-600 text-sm';
        departmentElement.textContent = `录取部门：${department}`;
        center.appendChild(departmentElement);
      }
      if (message) {
        const messageElement = document.createElement('p');
        messageElement.className = kind === 'error'
          ? 'text-red-600 font-medium'
          : 'text-gray-600 text-sm';
        messageElement.textContent = message;
        center.appendChild(messageElement);
      }

      card.appendChild(center);
      resultDiv.replaceChildren(card);
      resultDiv.style.display = 'block';
    }

    async function loadRecruitmentConfig() {
      const queryButton = document.getElementById('query-button');
      try {
        const response = await fetch('/api/recruitment/config', {
          headers: { Accept: 'application/json' },
        });
        if (!response.ok) throw new Error('配置请求失败');
        const config = await response.json();
        if (!config.admissionQuery || !config.contact) throw new Error('配置内容不完整');

        renderRecruitmentContact(document.getElementById('admission-contact'), config.contact);
        admissionQueryEnabled = config.admissionQuery.enabled === true;
        queryButton.disabled = !admissionQueryEnabled;
        queryButton.textContent = admissionQueryEnabled ? '查询' : '录取查询当前未开放';
        if (!admissionQueryEnabled) {
          showResult({
            title: '录取查询尚未开放',
            message: '录取查询尚未开放，请留意协会后续通知。',
          });
        } else {
          clearResult();
        }
      } catch (error) {
        admissionQueryEnabled = false;
        queryButton.disabled = true;
        queryButton.textContent = '录取查询暂不可用';
        showResult({
          title: '暂时无法查询',
          message: '录取查询安排暂时无法读取，请稍后重试或联系协会负责人。',
          kind: 'error',
        });
      }
    }

    async function checkAdmission() {
      const studentIdInput = document.getElementById('student-id-input');
      const phoneInput = document.getElementById('phone-input');
      const queryButton = document.getElementById('query-button');
      const studentId = studentIdInput.value.trim();
      const phone = phoneInput.value.trim();

      if (!admissionQueryEnabled) {
        showResult({
          title: '录取查询当前不可用',
          message: '请留意页面上的查询安排。',
        });
        return;
      }

      if (!/^\d{12}$/.test(studentId)) {
        showResult({ title: '输入有误', message: '请输入正确的12位学号', kind: 'error' });
        studentIdInput.focus();
        return;
      }

      if (!/^1[3-9]\d{9}$/.test(phone)) {
        showResult({ title: '输入有误', message: '请输入正确的11位手机号', kind: 'error' });
        phoneInput.focus();
        return;
      }

      queryButton.disabled = true;
      queryButton.textContent = '查询中…';
      try {
        const response = await fetch('/api/admissions/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId, phone }),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          const message = typeof result.detail === 'string'
            ? result.detail
            : '查询失败，请稍后重试。';
          showResult({
            title: response.status === 404 ? '未找到录取结果' : '查询未完成',
            message,
            kind: response.status >= 500 ? 'error' : 'neutral',
          });
          return;
        }

        const accepted = result.status === '已录取';
        showResult({
          title: `${result.name}同学`,
          status: result.status,
          department: result.department,
          kind: accepted ? 'accepted' : 'rejected',
        });
      } catch (error) {
        showResult({
          title: '查询未完成',
          message: '网络连接异常，请稍后重试。',
          kind: 'error',
        });
      } finally {
        queryButton.disabled = !admissionQueryEnabled;
        queryButton.textContent = admissionQueryEnabled ? '查询' : '录取查询当前未开放';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const studentIdInput = document.getElementById('student-id-input');
      const phoneInput = document.getElementById('phone-input');
      document.getElementById('query-button').addEventListener('click', checkAdmission);
      const triggerQuery = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          checkAdmission();
        }
      };
      studentIdInput.addEventListener('keydown', triggerQuery);
      phoneInput.addEventListener('keydown', triggerQuery);
      loadRecruitmentConfig();
    });
  </script>
</body>
</html>
