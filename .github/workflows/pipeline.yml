name: CI/CD Pipeline

"on":
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      build_docker:
        description: "Build and publish Docker image to GHCR"
        type: boolean
        default: false
      sha:
        description: "Target 40-character commit SHA (defaults to trigger commit)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 阶段 1：快速质量与安全门禁（日常 push / PR / 发布前必跑，~35秒）
  verify:
    name: Code & API Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: |
          uv sync --project backend --frozen
          bun install --frozen-lockfile
          bun install --cwd frontend --frozen-lockfile

      - name: Check frontend build is in sync
        run: |
          bun run build:frontend
          git diff --exit-code public/html/trainings.html public/html/honors.html public/html/index.html public/html/about-association.html

      - name: Run fast verification gate
        run: bun run verify

  # 阶段 2：Docker 镜像构建与发布（单人 DevOps 强防呆：严格依赖阶段 1 成功）
  # 仅在推送版本 Tag（v*）或在 GitHub 页面手动勾选 build_docker 时触发
  docker-publish:
    name: Build & Publish Docker Image (GHCR)
    needs: verify
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_docker == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve target ref
        id: target
        run: |
          INPUT_SHA="${{ github.event.inputs.sha }}"
          if [ -n "$INPUT_SHA" ]; then
            if [[ ! "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid commit SHA: $INPUT_SHA (must be 40 hex characters)"
              exit 1
            fi
            echo "ref=$INPUT_SHA" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Determine commit SHA and metadata
        id: meta
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "sha=$ACTUAL_SHA" >> $GITHUB_OUTPUT
          echo "short_sha=${ACTUAL_SHA:0:7}" >> $GITHUB_OUTPUT

          OWNER_LOWER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_BASE="ghcr.io/${OWNER_LOWER}/radio-association"
          echo "image_base=$IMAGE_BASE" >> $GITHUB_OUTPUT

          TAGS="${IMAGE_BASE}:${ACTUAL_SHA},${IMAGE_BASE}:${ACTUAL_SHA:0:7}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS},${IMAGE_BASE}:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Print image digest and deployment instructions
        run: |
          echo "::notice title=Docker Image Published::Image tag: ${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.sha }}"
          echo "Deploy on server with:"
          echo "  cd /opt/radio-association/docker/src"
          echo "  sudo bash deployment/deploy.sh ${{ steps.meta.outputs.sha }}"
