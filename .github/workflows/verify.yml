name: Verify

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: |
          uv sync --project backend --frozen
          bun install --frozen-lockfile
          bun install --cwd frontend --frozen-lockfile

      - name: Check frontend build is in sync
        run: |
          bun run build:frontend
          git diff --exit-code public/html/trainings.html

      - name: Run fast verification
        run: bun run verify

  dev-full:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: |
          uv sync --project backend --frozen
          bun install --frozen-lockfile
          bun install --cwd frontend --frozen-lockfile

      - name: Check frontend build is in sync
        run: |
          bun run build:frontend
          git diff --exit-code public/html/trainings.html

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run full release verification
        run: bun run verify:release
